@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C1210; --card:#151D1A; --elev:#1F2A25; --line:#27332D; --ink:#F1F5F2; --mut:#9FADA5;
    --acc:#C6F36D; --onacc:#10160F; --pos:#C6F36D; --warn:#F2B45A; --neg:#FF8F7A;
    --glass:rgba(34,46,40,.58); --glass-line:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.22); --glass-sel:rgba(255,255,255,.14);
    --glow:rgba(104,168,84,.36); --shadow:0 14px 34px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.5);
    --cg:#6FD39B; --co:#F2A061; --cb:#8FA2FF; --cv:#B9A0FF; --cr:#F28DB2; --ca:#E8C062; --cn:#A9B5AE; --ct:#6FD3C9;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation;background:var(--bg)}
button,a,label,input,select{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pos);outline-offset:2px}
.disp{font-weight:800;letter-spacing:-.02em}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mute{color:var(--mut)} .warn{color:var(--warn)}
.small{font-size:12px} .center{text-align:center}
svg.i{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glassy{background:var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%)}

#banner{background:var(--neg);color:var(--bg);font-size:13px;font-weight:700;padding:10px 20px;text-align:center}
main{position:relative;max-width:600px;margin:0 auto;padding-bottom:calc(118px + env(safe-area-inset-bottom,0px));overflow-x:hidden;min-height:100vh}
.glow{position:absolute;left:-80px;top:-170px;width:560px;height:440px;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none;z-index:0}
main>*:not(.glow){position:relative;z-index:1}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 12px 20px}
header.top h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
header.top h1.sm{font-size:18px;letter-spacing:-.02em}
header.top .pre{display:block;font-size:12px;font-weight:600;color:var(--mut)}

header.top .acts{display:flex;align-items:center;gap:8px;flex:none}
header.top.back{padding-left:16px;justify-content:flex-start}
header.top.back h1{font-size:22px;flex:1}
header.top.home{padding-top:calc(16px + env(safe-area-inset-top,0px))}
.iconbtn,.rbtn{appearance:none;width:44px;height:44px;border-radius:22px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);display:grid;place-items:center;color:var(--ink);flex:none;padding:0;position:relative}
.avbtn{appearance:none;border:0;width:44px;height:44px;border-radius:22px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;flex:none;padding:0}
.mswitch{display:flex;align-items:center;border-radius:22px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);flex:none}
.mswitch button{appearance:none;border:0;background:transparent;width:40px;height:42px;display:grid;place-items:center;color:var(--ink);padding:0}
.mswitch span{font-size:13px;font-weight:800;min-width:74px;text-align:center}
.searchf{display:flex;align-items:center;gap:10px;margin:0 16px;height:46px;padding:0 14px;border-radius:23px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);color:var(--mut)}
.searchf input{flex:1;min-width:0;appearance:none;-webkit-appearance:none;border:0;outline:0;background:transparent;font-size:16px;font-weight:600;color:var(--ink)}
.searchf input::placeholder{color:var(--mut);font-size:14px}

/* filter pills */
.filters{display:flex;gap:6px;padding:12px 16px 2px}
.fpill{appearance:none;flex:1;height:40px;border-radius:20px;font-size:13px;font-weight:700;background:transparent;color:var(--mut);border:1px solid var(--line);padding:0 6px;white-space:nowrap}
.fpill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* cards */
.hcard,.card,.setcard,.gcard{margin:0 16px;background:var(--card);border:1px solid var(--line);border-radius:26px}
.hcard{padding:14px 18px 16px}
.card{overflow:hidden;padding:2px 16px;border-radius:24px}
.gcard{padding:14px 16px}
.mt{margin-top:10px}
.lbl{font-size:12px;font-weight:600;color:var(--mut)}
.bignum{font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1.1;white-space:nowrap}
.bignum.md{font-size:30px;line-height:1.15}
.bignum .cur,.cur{font-size:.42em;color:var(--mut);font-weight:700;margin-left:5px;letter-spacing:0}
.badge{font-size:11px;font-weight:800;color:var(--pos);background:color-mix(in srgb,var(--pos) 14%,transparent);border-radius:10px;padding:4px 8px;white-space:nowrap}
.badge.up{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.badge.flat{color:var(--mut);background:var(--elev)}
.rowsb{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rowbl{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pillbtn{position:relative;appearance:none;height:36px;margin-left:-6px;padding:0 8px 0 12px;border-radius:18px;background:var(--elev);border:0;color:var(--ink);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.pillbtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.linkr{appearance:none;border:0;background:none;height:36px;display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--mut);padding:0}
.minichart{display:block;width:100%;height:auto;margin-top:10px}
.axisx{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:600;color:var(--mut);margin-top:2px}
.axisx .dash{display:inline-flex;align-items:center;gap:5px}
.axisx .dash i{width:12px;border-top:1.5px dashed var(--mut);display:inline-block}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.tiles3>div{background:var(--elev);border-radius:16px;padding:9px 11px;min-width:0}
.tiles3 .k{font-size:10px;font-weight:600;color:var(--mut)}
.tiles3 .v{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles3 .accent{background:var(--acc);color:var(--onacc)}
.tiles3 .accent .k{color:var(--onacc);font-weight:700}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 16px 0}
.duo button{appearance:none;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 14px;color:var(--ink);min-width:0}
.duo .k{display:flex;justify-content:space-between;gap:6px;font-size:11px;font-weight:600;color:var(--mut)}
.duo .v{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{min-width:20px;height:20px;border-radius:10px;background:var(--warn);color:var(--bg);font-size:11px;font-weight:800;display:inline-grid;place-items:center;padding:0 5px}
.chartwrap{position:relative;margin-top:8px}
.chartwrap svg{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.ctip{position:absolute;display:none;align-items:center;gap:6px;background:var(--elev);border:1px solid var(--line);border-radius:12px;padding:4px 9px;font-size:11px;font-weight:700;white-space:nowrap;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.ctip.show{display:inline-flex}
.ctip i{width:7px;height:7px;border-radius:4px;background:var(--pos);display:inline-block}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;margin-top:10px;background:var(--elev);border-radius:20px;padding:3px}
.seg button{appearance:none;border:0;height:38px;border-radius:19px;font-size:12px;font-weight:700;background:transparent;color:var(--mut);padding:0}
.seg button.on{background:var(--ink);color:var(--card)}
.gainrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;padding:10px 12px;background:var(--elev);border-radius:16px}
.gainrow .k{font-size:12px;font-weight:700}
.gainrow .s{font-size:11px;color:var(--mut);font-weight:600}
.gainrow b{font-weight:800;text-align:right;white-space:nowrap;font-size:15px}
.gainrow small{display:block;font-size:11px;font-weight:800}
.sbar{display:flex;height:8px;gap:3px}
.sbar i{display:block;border-radius:4px;min-width:4px}
.aleg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.aleg .k{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aleg .k i{width:8px;height:8px;border-radius:4px;display:inline-block;flex:none}
.aleg .v{font-weight:800}
.psegs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;margin-top:14px}
.psegs i{display:block;height:6px;border-radius:3px;background:var(--elev)}
.psegs i.done{background:var(--pos)} .psegs i.next{background:var(--warn)}

/* sections & rows */
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px 8px}
.sh h2{margin:0;font-size:15px;font-weight:700}
.sh .r{font-size:12px;color:var(--mut);font-weight:600}
.sh .r.b{font-size:13px;font-weight:800}
.card .ch2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0 2px}
.card .ch2 h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card .ch2 .r{font-size:12px;color:var(--mut);font-weight:600}
.link{appearance:none;border:0;background:none;color:var(--mut);font-size:12px;font-weight:700;padding:4px 0}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);color:var(--ink)}
.card>.row:first-child,.card>.occ:first-child,.card>.srow:first-child,.card>.ch2+.row,.card>.ch2+.srow,.card>.catrow:first-child,.card>.sbar+.catrow{border-top:0}
button.row:active,.srow .sr1:active{opacity:.7}
.tile{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;flex:none;font-size:18px;background:var(--elev)}
.tile.sm{width:36px;height:36px;border-radius:18px;font-size:16px}
.row .main{flex:1;min-width:0}
.row .t{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:block;font-size:12px;font-weight:500;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s.warn{color:var(--warn);font-weight:600}
.amt{font-weight:800;white-space:nowrap}
.amtc{text-align:right;flex:none}
.amtc .s2{display:block;font-size:11px;font-weight:800;color:var(--mut)}
.actb{appearance:none;flex:none;border:0;height:36px;padding:0 12px;border-radius:18px;background:var(--elev);color:var(--ink);font-size:12px;font-weight:800}
.actb.acc{background:var(--acc);color:var(--onacc);height:40px;padding:0 14px;border-radius:20px}
.dayhead{display:flex;justify-content:space-between;padding:12px 22px 6px;font-size:12px;font-weight:700;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:40px 28px;font-weight:600}
.masked{letter-spacing:.06em}
.mcard{margin:10px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:6px 6px 12px}
.mcard .mnav{display:flex;align-items:center;justify-content:space-between}
.mcard .mnav button{appearance:none;border:0;background:transparent;width:44px;height:40px;display:grid;place-items:center;color:var(--ink);padding:0}
.mcard .mnav span{font-size:14px;font-weight:800}
.mcard .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:2px 12px 0}
.mcard .nums .k{font-size:11px;font-weight:600;color:var(--mut)}
.mcard .nums .v{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notice{margin:10px 16px 0;display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--warn) 12%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:22px;padding:10px 10px 10px 14px;font-size:12px;font-weight:600;line-height:1.35}
.notice svg{color:var(--warn)}
.notice .tx{flex:1}

/* recurring */
.avatar{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 16px}
.ptile{appearance:none;text-align:left;display:flex;flex-direction:column;align-items:flex-start;padding:12px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--ink);min-width:0}
.ptile .tp{display:flex;justify-content:space-between;align-items:center;width:100%;gap:4px}
.ptile .tp .avatar{width:34px;height:34px;border-radius:17px;font-size:12px}
.ptile .am{font-size:13px;font-weight:800;white-space:nowrap}
.ptile .nm{display:block;font-weight:800;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ptile .stt{display:block;font-size:11px;font-weight:600;color:var(--mut)}
.btn-dark{appearance:none;border:0;height:36px;padding:0 14px;border-radius:18px;background:var(--acc);color:var(--onacc);font-size:12px;font-weight:800;flex:none}
.srow{border-top:1px solid var(--line);padding:10px 0}
.srow .sr1{display:flex;align-items:center;gap:12px;cursor:pointer}
.dbadge{width:42px;height:44px;flex:none;text-align:center;border-radius:14px;padding-top:4px;background:var(--elev);color:var(--ink)}
.dbadge .d{display:block;font-size:16px;font-weight:800;line-height:1.1}
.dbadge .m{display:block;font-size:10px;font-weight:700;text-transform:uppercase}
.dbadge.ok{background:color-mix(in srgb,var(--pos) 14%,transparent);color:var(--pos)}
.dbadge.next{background:var(--ink);color:var(--card)}
.srow .main{flex:1;min-width:0}
.srow .n{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .meta{display:block;font-size:12px;font-weight:500;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .rt{text-align:right;flex:none}
.srow .rt .a{display:block;font-weight:800;white-space:nowrap}
.srow .rt .st{display:block;font-size:11px;font-weight:700;color:var(--mut);white-space:nowrap}
.srow .rt .st.pos{color:var(--pos)} .srow .rt .st.warn{color:var(--warn)}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.srow .mchips{padding-left:54px}
.mchip{appearance:none;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:15px;font-size:11px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--mut)}
.mchip.ok{border-color:var(--pos);background:color-mix(in srgb,var(--pos) 10%,transparent);color:var(--pos)}
.mini{appearance:none;border:0;height:32px;padding:0 12px;border-radius:16px;background:var(--acc);color:var(--onacc);font-size:12px;font-weight:800}
.okl{appearance:none;border:0;background:transparent;color:var(--pos);font-size:12px;font-weight:800;padding:0}
.occ{padding:12px 0;border-top:1px solid var(--line)}
.occ .h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.occ .h b{font-weight:700}

/* assets */
.gstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.gstats>div{background:var(--elev);border-radius:16px;padding:9px 11px;min-width:0}
.gstats .k{display:block;font-size:10px;color:var(--mut);font-weight:600}
.gstats b{display:block;font-weight:800;white-space:nowrap;font-size:13px;overflow:hidden;text-overflow:ellipsis}

/* stats */
.catrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.catrow .main{flex:1;min-width:0}
.catrow .n{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .p{display:block;font-size:12px;font-weight:600;color:var(--mut)}
.catrow .rt{text-align:right;flex:none}
.catrow .rt .a{display:block;font-weight:800;white-space:nowrap}
.catrow .rt .tr{display:block;font-size:11px;font-weight:800;white-space:nowrap}
.year{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));align-items:end}
.year button{appearance:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:12px;padding:6px 0 4px;background:transparent}
.year button.on{background:var(--elev)}
.year .bars{display:flex;align-items:flex-end;gap:2px;height:64px;opacity:.45}
.year button.on .bars{opacity:1}
.year .bars i{width:5px;border-radius:3px;display:block}
.year .lab{font-size:9px;color:var(--mut);font-weight:800}
.year button.on .lab{color:var(--ink)}
.legend{display:flex;gap:10px;font-size:11px;color:var(--mut);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.avg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 8px 0;padding-top:12px;border-top:1px solid var(--line)}
.avg3 .k{font-size:11px;font-weight:600;color:var(--mut)}
.avg3 .v{font-weight:800;white-space:nowrap}

/* buttons, forms */
.btn{appearance:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:29px;min-height:56px;padding:0 18px;font-weight:800;font-size:15px;background:var(--acc);color:var(--onacc);text-align:center}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--neg);border:1px solid color-mix(in srgb,var(--neg) 45%,transparent)}
.btn.sm{width:auto;display:inline-flex;min-height:44px;padding:0 16px;font-size:13px;border-radius:22px}
.btn+.btn{margin-top:10px}
.pad{padding:0 16px}
.stack{display:grid;gap:10px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btnrow .btn{margin:0}
.note{font-size:13px;color:var(--mut);margin:0 0 10px}
.field{display:block;margin:12px 0}
.field>span{display:block;font-size:12px;color:var(--mut);margin-bottom:6px;font-weight:600}
.inp,select.inp{width:100%;font-size:16px;font-weight:600;padding:12px 16px;border-radius:18px;border:1px solid var(--line);background:var(--elev);color:var(--ink);appearance:none;-webkit-appearance:none;min-height:50px}
.inp::placeholder{color:var(--mut);font-weight:500}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 52%,calc(100% - 15px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.hint{font-size:12px;color:var(--mut);margin:-4px 0 12px}
.toggle{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;font-size:14px;font-weight:600;cursor:pointer;margin:12px 0}
.toggle input{appearance:auto;-webkit-appearance:checkbox;width:22px;height:22px;margin:0;flex:none;accent-color:var(--pos)}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:4px 4px 4px 5px;font-size:13px;font-weight:600}

  var fn = {home:vHome, tx:vTx, stats:vStats, subs:vSubs, assets:vAssets, settings:vSettings}[v] || vHome;
  $('#view').innerHTML = '<div class="glow" aria-hidden="true"></div>' + fn();

}

}

/* ---------- sheet ---------- */
function openSheet(html, after, full){
  var sh = document.querySelector('.sheet');
  $('#sheet').innerHTML = html;
  sh.classList.toggle('full', !!full);
  $('#sheetWrap').hidden = false;
  document.body.classList.add('locked');
  sh.scrollTop = 0;
  ui.txOpen = false;
  if (after) after();
}
function closeSheet(){
  $('#sheetWrap').hidden = true;
  document.body.classList.remove('locked');
  document.querySelector('.sheet').classList.remove('full');
  ui.txOpen = false;
}

/* ---------- new / edit transaction ---------- */
var CTA = {expense:'Uložit výdaj', income:'Uložit příjem', transfer:'Převést', refund:'Uložit vratku', reval:'Uložit'};
function prettyAmt(a){
  a = String(a || '0'); var neg = a.charAt(0) === '-'; if (neg) a = a.slice(1);
  var p = a.split(','), ip = (p[0] || '0').replace(/^0+(?=\d)/, '');
  ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0');
  return (neg ? '−' : '') + ip + (p.length > 1 ? ',' + p[1] : '');
}
function amtHtml(d){
  var v = parseAmt(d.amount), nz = isFinite(v) && v !== 0;
  var sign = !nz ? '' : d.type === 'expense' ? '−' : (d.type === 'income' || d.type === 'refund') ? '+' : '';
  return sign + prettyAmt(d.amount) + '<span class="k">' + esc(curSym(accCur(acc(d.acc)))) + '</span>';
}
function amtColor(d){ return (d.type === 'income' || d.type === 'refund') ? 'var(--green)' : 'var(--ink)'; }
function ctaText(d){
  var v = parseAmt(d.amount);
  if (!(isFinite(v) && v !== 0)) return d.id ? 'Uložit' : 'Chybí částka';
  return (d.id ? 'Uložit' : CTA[d.type]) + ' · ' + prettyAmt(d.amount) + '\u00a0' + curSym(accCur(acc(d.acc)));
}
function catsSorted(kind){
  var list = kind === 'income' ? S.cats.income : S.cats.expense, cnt = {}, lim = fmtD(new Date(Date.now() - 180 * 864e5));
  S.tx.forEach(function(t){ if (t.cat && t.date >= lim) cnt[t.cat] = (cnt[t.cat] || 0) + 1; });
  return list.map(function(c, i){ return {c:c, i:i, n:cnt[c.id] || 0}; }).sort(function(a, b){ return b.n - a.n || a.i - b.i; }).map(function(o){ return o.c; });
}
function amtLabel(d){
  var c = cat(d.cat);
  return {expense:'Výdaj', income:'Příjem', transfer:'Převod mezi účty', refund:'Vratka · sníží výdaje v kategorii', reval:'Změna hodnoty'}[d.type] + ((d.type === 'expense' || d.type === 'income') && c ? ' · ' + c.name : '');
}
function amtLabel(d){
  var c = cat(d.cat);
  return {expense:'Výdaj', income:'Příjem', transfer:'Převod mezi účty', refund:'Vratka sníží výdaje', reval:'Změna hodnoty'}[d.type] + ((d.type !== 'transfer' && d.type !== 'reval') && c ? ' · ' + c.name : '');
}
function tplList(){
  var lim = fmtD(new Date(Date.now() - 120 * 864e5)), m = {};
  S.tx.forEach(function(t){
    if (t.type !== 'expense' || t.date < lim || t.sub) return;
    var name = (t.place || t.note || '').trim(); if (!name || !cat(t.cat) || !acc(t.acc)) return;
    var k = name.toLowerCase() + '|' + t.cat, o = m[k] || (m[k] = {name:name, n:0, last:'', t:null});
    o.n++; if (t.date >= o.last) { o.last = t.date; o.t = t; }
  });
  return Object.keys(m).map(function(k){ return m[k]; }).filter(function(o){ return o.n >= 2; }).sort(function(a, b){ return b.n - a.n || (a.last < b.last ? 1 : -1); }).slice(0, 5);
}
function useTpl(i){

}

  if (ui.tpls.length) h += '<div class="tpls"><span class="tl">Znovu</span>' + ui.tpls.map(function(o, i){ return '<button onclick="App.useTpl(' + i + ')">' + esc(o.name) + ' · ' + NF.format(o.t.amount) + '</button>'; }).join('') + '</div>';
  if (cats.length) h += '<div class="cgrid" id="cats">' + cats.map(function(c){

  }).join('') + '</div>';
  if (d.type === 'transfer') {
    var T = acc(d.to);
    h += '<div class="xfer"><button class="abox" onclick="App.accPick(\'acc\')"><span class="k">Z účtu' + (A ? ' · ' + esc(tinfo(A).s) : '') + '</span><span class="v">' + esc(A ? A.name : '') + '</span></button>' +
      '<span class="xarrow" aria-hidden="true">' + ic('chevR', 16, 2.6) + '</span>' +
      '<button class="abox" onclick="App.accPick(\'to\')"><span class="k">Na účet' + (T ? ' · ' + esc(tinfo(T).s) : '') + '</span><span class="v">' + esc(T ? T.name : '') + '</span></button></div>';
    if (A && T && accCur(A) !== accCur(T)) h += '<label class="xamt"><span>Připsáno</span><input class="inp" id="amt2" inputmode="decimal" placeholder="' + esc(conv2(d)) + '" value="' + esc(d.amount2 || '') + '" oninput="App.txSet(\'amount2\',this.value)"><b>' + esc(curSym(accCur(T))) + '</b></label>';

/* Category tiles: up to 3 rows that scroll sideways; rows shrink so the sheet never scrolls vertically. */
function fitCats(){
  var g = document.getElementById('cats'), sh = document.querySelector('.sheet');
  if (!g || !sh || !sh.classList.contains('full')) return;
  var n = g.children.length, avail = g.clientWidth - 28, rows = Math.min(3, Math.max(1, Math.ceil(n / 4)));
  for (; rows >= 1; rows--) {
    var cols = Math.ceil(n / rows);
    var cw = cols <= 4 ? (avail - 18) / 4 : (avail - 18) / 3.6;
    g.style.setProperty('--rows', rows);
    g.style.setProperty('--cw', Math.min(120, Math.max(64, cw)).toFixed(1) + 'px');
    if (sh.scrollHeight <= sh.clientHeight + 1) break;
  }
  if (rows < 1) g.style.setProperty('--rows', 1);
}
function readDraft(){ if (!draft) return; var n = document.getElementById('noteIn'); if (n) draft.note = n.value; var pi = document.getElementById('placeIn'); if (pi) draft.place = pi.value; var ai = document.getElementById('amtIn'); if (ai) draft.amount = ai.value; }
function setTxType(t){ readDraft(); if (draft.type !== t) { draft.cat = ''; draft.ref = ''; } draft.type = t; draft.noFocus = true; txSheet(); }
function pickCat(id){
  draft.cat = id;
  document.querySelectorAll('#cats .ctile').forEach(function(c){ var on = c.getAttribute('data-cat') === id; c.classList.toggle('on', on); c.setAttribute('aria-pressed', on); });
  var al = document.getElementById('amtLbl'); if (al) al.textContent = amtLabel(draft);
}
function txSet(f, v){
  draft[f] = v;
  if (f === 'acc') { var l = document.getElementById('accLbl'); if (l) l.textContent = (acc(v) || {}).name || ''; }
  if (f === 'to') { var t = document.getElementById('toLbl'); if (t) t.textContent = (acc(v) || {}).name || ''; }
  if (f === 'date') { var dl = document.getElementById('dateLbl'); if (dl) dl.textContent = dateLbl(v); }
}
function placeStats(){
  var m = {};
  S.tx.forEach(function(t){
    if (!t.place) return;
    var k = t.place.trim().toLowerCase(); if (!k) return;
    var o = m[k] || (m[k] = {name:t.place.trim(), n:0, last:'', cat:''});
    o.n++; if (t.date >= o.last) { o.last = t.date; o.name = t.place.trim(); if (t.type === 'expense') o.cat = t.cat; }
  });
  return m;
}
function placeSugHtml(q){
  q = (q || '').trim().toLowerCase();
  var m = placeStats(), list = Object.keys(m).map(function(k){ return m[k]; });
  list = list.filter(function(o){ var k = o.name.toLowerCase(); return k !== q && (!q || k.indexOf(q) >= 0); });
  if (draft && draft.cat && !q) list.sort(function(a, b){ return ((b.cat === draft.cat) - (a.cat === draft.cat)) || b.n - a.n || (a.last < b.last ? 1 : -1); });
  else list.sort(function(a, b){ return b.n - a.n || (a.last < b.last ? 1 : -1); });
  return list.slice(0, 8).map(function(o){ return '<button class="pchip" data-p="' + esc(o.name) + '" onclick="App.pickPlace(this.getAttribute(\'data-p\'))">' + esc(o.name) + '</button>'; }).join('');
}
function txPlace(){ readDraft(); draft.placeOpen = true; draft.noteOpen = false; draft.placeFocus = true; draft.noFocus = true; txSheet(); }
function placeIn(v){ draft.place = v; var el = document.getElementById('psug'); if (el) { el.innerHTML = placeSugHtml(v); fitCats(); } }

function txNote(){ readDraft(); draft.noteOpen = true; draft.placeOpen = false; draft.noFocus = true; draft.noteFocus = true; txSheet(); }
function txSign(){ readDraft(); var a = String(draft.amount || ''); draft.amount = a.charAt(0) === '-' ? a.slice(1) : '-' + a; var ai = document.getElementById('amtIn'); if (ai) { ai.value = draft.amount; var c = document.getElementById('cta'); if (c) c.textContent = ctaText(draft); } else updAmt(); }

function refListHtml(q){

  }).join('') + '</div>';

function conv2(d){
  var A = acc(d.acc), T = acc(d.to), v = parseAmt(d.amount); if (!A || !T || !isFinite(v)) return '0';
  return String(Math.round(v * fxAt(accCur(A), d.date) / fxAt(accCur(T), d.date) * 100) / 100).replace('.', ',');

function key(k){
  if (!draft) return;
  var a = String(draft.amount || ''), neg = a.charAt(0) === '-';
  if (neg) a = a.slice(1);
  if (a === '0') a = '';
  if (k === 'del') a = a.slice(0, -1);
  else if (k === ',') { if (a.indexOf(',') < 0) a = (a || '0') + ','; }
  else { var p = a.split(','); if (p.length > 1) { if (p[1].length < 2) a += k; } else if (p[0].replace(/\D/g, '').length < 9) a += k; }

/* ---------- helpers ---------- */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtD(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function today(){ return fmtD(new Date()); }
function parseD(s){ var p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function curYM(){ return today().slice(0,7); }
function addMonths(ym, n){ var p = ym.split('-').map(Number); var d = new Date(p[0], p[1]-1+n, 1); return d.getFullYear() + '-' + pad(d.getMonth()+1); }
function ymLabel(ym){ var p = ym.split('-').map(Number); var s = MONTHS[p[1]-1]; return s[0].toUpperCase() + s.slice(1) + ' ' + p[0]; }
function monthEnd(ym){ var p = ym.split('-').map(Number); return fmtD(new Date(p[0], p[1], 0)); }
function dShort(s){ var d = parseD(s); return d.getDate() + '. ' + (d.getMonth()+1) + '. ' + d.getFullYear(); }
function dayLabel(s){
  if (s === today()) return 'Dnes';
  var y = new Date(); y.setDate(y.getDate()-1);
  if (s === fmtD(y)) return 'Včera';
  var d = parseD(s), wd = d.toLocaleDateString('cs-CZ', {weekday:'long'});
  return wd[0].toUpperCase() + wd.slice(1) + ' ' + d.getDate() + '. ' + (d.getMonth()+1) + '.' + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
function daysBetween(a, b){ return Math.round((parseD(b) - parseD(a)) / 864e5); }
function pl(n, a, b, c){ return n === 1 ? a : (n >= 2 && n <= 4 ? b : c); }
function zap(n, a, b, c){ return pl(n,'Zapsána','Zapsány','Zapsáno') + ' ' + n + ' ' + pl(n, a, b, c); }

var NF = new Intl.NumberFormat('cs-CZ', {maximumFractionDigits:2});
var NFC;
try { NFC = new Intl.NumberFormat('cs-CZ', {notation:'compact', maximumFractionDigits:1}); } catch(e) { NFC = null; }
function money(n, sign){
  var r = Math.round(n*100)/100, p = '';
  if (r < 0) p = '−'; else if (sign && r > 0) p = '+';
  return p + NF.format(Math.abs(r)) + '\u00a0' + esc(S.currency);
}
function compact(n){
  if (NFC) return NFC.format(n);
  var a = Math.abs(n);
  if (a >= 1e6) return (n/1e6).toFixed(1).replace('.', ',') + ' mil.';
  if (a >= 1e3) return Math.round(n/1e3) + ' tis.';
  return String(Math.round(n));
}
function pct(x){ return (x*100).toFixed(0) + '\u00a0%'; }
function parseAmt(s){
  if (typeof s === 'number') return s;
  var v = parseFloat(String(s || '').replace(/[\s\u00a0]/g,'').replace(',', '.').replace('−','-'));
  return isFinite(v) ? v : NaN;
}
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('on'); }, 2600);
}
function sortTx(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : (a.id < b.id ? 1 : -1); }

/* ---------- storage ---------- */
function defaultState(){
  return {
    v:1, currency:'Kč', accounts:[], tx:[], subs:[], lastBackup:null, lastAcc:null, hideWealth:true,
    cats:{
      expense: DEF_CATS.expense.map(function(c,i){ return {id:'e'+i, name:c[0], icon:c[1]}; }),
      income: DEF_CATS.income.map(function(c,i){ return {id:'i'+i, name:c[0], icon:c[1]}; })
    }
  };
}
function normalize(s){
  var d = defaultState();
  if (!s || typeof s !== 'object') return d;
  var out = Object.assign({}, d, s);
  out.cats = {
    expense: s.cats && Array.isArray(s.cats.expense) ? s.cats.expense : d.cats.expense,
    income: s.cats && Array.isArray(s.cats.income) ? s.cats.income : d.cats.income
  };
  out.accounts = Array.isArray(s.accounts) ? s.accounts : [];
  out.tx = Array.isArray(s.tx) ? s.tx : [];
  out.subs = Array.isArray(s.subs) ? s.subs : [];
  if (!out.currency) out.currency = 'Kč';
  return out;
}
function load(){
  var raw = null, s = null;
  try { raw = localStorage.getItem(KEY); } catch(e) { storageOk = false; }
  if (raw) { try { s = JSON.parse(raw); } catch(e) {} }
  return normalize(s);
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }
  catch(e) { storageOk = false; }
  banner();
}
function testStorage(){
  try { localStorage.setItem(KEY+'.t','1'); localStorage.removeItem(KEY+'.t'); }
  catch(e) { storageOk = false; }
}
function banner(){
  var b = $('#banner');
  if (storageOk) { b.hidden = true; return; }
  b.hidden = false;
  b.textContent = 'Tento prohlížeč neukládá data. Po zavření se ztratí – je potřeba jiný prohlížeč nebo pravidelná záloha.';
}

/* ---------- data logic ---------- */
function acc(id){ for (var i=0;i<S.accounts.length;i++) if (S.accounts[i].id === id) return S.accounts[i]; return null; }
function cat(id){
  if (!id) return null;
  var all = S.cats.expense.concat(S.cats.income);
  for (var i=0;i<all.length;i++) if (all[i].id === id) return all[i];
  return null;
}
function tinfo(a){ return TYPES[a && a.type] || TYPES.bank; }

function balances(upTo){
  var b = {};
  S.accounts.forEach(function(a){ b[a.id] = (!upTo || a.start <= upTo) ? (+a.initial || 0) : 0; });
  S.tx.forEach(function(t){
    if (upTo && t.date > upTo) return;
    var v = +t.amount || 0;
    if (t.type === 'expense') { if (t.acc in b) b[t.acc] -= v; }
    else if (t.type === 'income' || t.type === 'reval' || t.type === 'refund') { if (t.acc in b) b[t.acc] += v; }
    else if (t.type === 'transfer') { if (t.acc in b) b[t.acc] -= v; if (t.to in b) b[t.to] += (t.amount2 != null ? +t.amount2 : v); }
  });
  return b;
}
function netWorth(upTo){
  var b = balances(upTo), s = 0;
  for (var k in b) s += b[k] * fxAt(accCur(acc(k)), upTo || today());
  return s + owedAt(upTo || today());
}
/* Shares from other people (refunds linked to a recurring payment) count in the month of
   the payment they belong to, and only once that payment is recorded. */
function myPayMap(){
  var m = {};
  m.__ref = {};
  S.tx.forEach(function(t){ if (t.type === 'expense') { m.__ref[t.id] = t; if (t.sub && t.due && !t.member) m[t.sub + '|' + t.due] = t; } });
  return m;
}
function statDate(t, pm){
  if (t.type === 'refund' && t.sub && t.due) { var e = pm[t.sub + '|' + t.due]; return e ? e.date : null; }
  if (t.type === 'refund' && t.ref && pm.__ref && pm.__ref[t.ref]) return pm.__ref[t.ref].date;
  return t.date;
}
function monthStats(ym){
  var m = {inc:0, exp:0, reval:0, byCat:{}, byInc:{}}, pm = myPayMap();
  S.tx.forEach(function(t){
    var sdt = statDate(t, pm);
    if (!sdt || sdt.slice(0,7) !== ym) return;
    var v = czk(t), k = t.cat || 'none';
    if (t.type === 'expense') { m.exp += v; m.byCat[k] = (m.byCat[k] || 0) + v; }
    else if (t.type === 'refund') { m.exp -= v; m.byCat[k] = (m.byCat[k] || 0) - v; }
    else if (t.type === 'income') { m.inc += v; m.byInc[k] = (m.byInc[k] || 0) + v; }
    else if (t.type === 'reval') { m.reval += v; }
  });
  return m;
}
/* Time series of net worth (or one account's balance) */
function seriesOld(months, accId){
  var ev = [], t = today();
  var accs = accId ? S.accounts.filter(function(a){ return a.id === accId; }) : S.accounts;
  accs.forEach(function(a){ ev.push([a.start, +a.initial || 0]); });
  S.tx.forEach(function(x){
    var v = +x.amount || 0, d = 0;
    if (accId) {
      if (x.acc === accId) d += (x.type === 'income' || x.type === 'reval' || x.type === 'refund') ? v : -v;
      if (x.type === 'transfer' && x.to === accId) d += v;
    } else {
      d = x.type === 'expense' ? -v : (x.type === 'income' || x.type === 'reval' || x.type === 'refund') ? v : 0;
    }
    if (d) ev.push([x.date, d]);
  });
  if (!accId) owedEvents().forEach(function(e){ ev.push(e); });
  ev.sort(function(a,b){ return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0; });
  var start = t;
  ev.forEach(function(e){ if (e[0] < start) start = e[0]; });
  if (months) { var dd = new Date(); dd.setMonth(dd.getMonth() - months); var s = fmtD(dd); if (s > start) start = s; }
  var days = daysBetween(start, t), dates = [], d, i;
  if (days <= 92) {
    d = parseD(t);
    for (i = 0; i <= days; i++) { dates.push(fmtD(d)); d.setDate(d.getDate()-1); }
  } else if (days <= 750) {
    d = parseD(t);
    while (fmtD(d) > start) { dates.push(fmtD(d)); d.setDate(d.getDate()-7); }
    dates.push(start);
  } else {
    dates.push(t);
    var ym = addMonths(t.slice(0,7), -1);
    while (monthEnd(ym) > start) { dates.push(monthEnd(ym)); ym = addMonths(ym, -1); }
    dates.push(start);
  }
  dates.reverse();
  var j = 0, sum = 0;
  var vals = dates.map(function(dt){ while (j < ev.length && ev[j][0] <= dt) { sum += ev[j][1]; j++; } return sum; });
  return {dates:dates, vals:vals};
}


/* ---------- recurring payments ---------- */
var PERIODS = {
  week:{n:'Týdně', m:0, f:52/12},
  month:{n:'Měsíčně', m:1, f:1},
  quarter:{n:'Čtvrtletně', m:3, f:1/3},
  half:{n:'Pololetně', m:6, f:1/6},
  year:{n:'Ročně', m:12, f:1/12}
};
var sd = null;
function subById(id){ return (S.subs || []).filter(function(x){ return x.id === id; })[0] || null; }
function dueAt(sub, k){
  var d0 = parseD(sub.first);
  if (sub.period === 'week') { var d = new Date(d0); d.setDate(d.getDate() + 7*k); return fmtD(d); }
  var y = d0.getFullYear(), mo = d0.getMonth() + (PERIODS[sub.period] || PERIODS.month).m*k, day = d0.getDate();
  var dim = new Date(y, mo+1, 0).getDate();
  return fmtD(new Date(y, mo, Math.min(day, dim)));
}
function dues(sub, until){
  var out = [], lim = sub.end && sub.end < until ? sub.end : until;
  for (var k = 0; k < 2000; k++) { var d = dueAt(sub, k); if (d > lim) break; out.push(d); }
  return out;
}
function nextDue(sub){
  if (sub.end) return null;
  var t = today();
  for (var k = 0; k < 2000; k++) { var d = dueAt(sub, k); if (d >= t) return d; }
  return null;
}
function lastDue(sub){ var p = dues(sub, today()); return p.length ? p[p.length-1] : sub.first; }
function myShare(sub){ return (+sub.amount || 0) - (sub.members || []).reduce(function(sm,m){ return sm + (+m.share || 0); }, 0); }
function myTx(sid, due){ return S.tx.filter(function(t){ return t.sub === sid && t.due === due && !t.member; })[0] || null; }
function memberTx(sid, due, mid){ return S.tx.filter(function(t){ return t.sub === sid && t.due === due && t.member === mid; })[0] || null; }
function memberDues(sub, mb, until){ return dues(sub, until).filter(function(d){ return !mb.since || d >= mb.since; }); }
function owed(){
  var map = {}, t = today();
  (S.subs || []).forEach(function(sub){
    (sub.members || []).forEach(function(mb){
      memberDues(sub, mb, t).forEach(function(due){
        if (memberTx(sub.id, due, mb.id)) return;
        var key = mb.name.trim().toLowerCase();
        if (!map[key]) map[key] = {key:key, name:mb.name.trim(), total:0, items:[]};
        map[key].total += +mb.share || 0;
        map[key].items.push({sid:sub.id, due:due, mid:mb.id});
      });
    });
  });
  return Object.keys(map).map(function(k){ return map[k]; }).sort(function(a,b){ return b.total - a.total; });
}
function subUnpaid(sub){
  var n = 0, t = today();
  (sub.members || []).forEach(function(mb){ memberDues(sub, mb, t).forEach(function(d){ if (!memberTx(sub.id, d, mb.id)) n++; }); });
  return n;
}
function relDay(d){
  var t = today(); if (d === t) return 'dnes';
  var z = new Date(); z.setDate(z.getDate()+1); if (d === fmtD(z)) return 'zítra';
  var x = parseD(d); return x.getDate() + '. ' + (x.getMonth()+1) + '.' + (x.getFullYear() !== new Date().getFullYear() ? ' ' + x.getFullYear() : '');
}
function subAcc(sub){ return acc(sub.acc) ? sub.acc : defaultAcc(); }
function processAuto(){
  var n = 0, t = today();
  (S.subs || []).forEach(function(sub){
    if (!sub.auto || sub.end) return;
    sub.handled = sub.handled || [];
    dues(sub, t).forEach(function(due){
      if (sub.handled.indexOf(due) >= 0) return;
      sub.handled.push(due);
      if (myTx(sub.id, due)) return;
      S.tx.push({id:uid(), date:due, type:'expense', amount:+sub.amount, acc:subAcc(sub), cat:sub.cat, note:sub.name, sub:sub.id, due:due});
      n++;
    });
  });
  return n;
}
function myPay(sid, due, quiet){
  var x = subById(sid); if (!x) return;
  var t = today();
  S.tx.push({id:uid(), date:due <= t ? due : t, type:'expense', amount:+x.amount, acc:subAcc(x), cat:x.cat, note:x.name, sub:sid, due:due});
  x.handled = x.handled || []; if (x.handled.indexOf(due) < 0) x.handled.push(due);
  save(); render(); if (!quiet) subDetail(sid); toast('Platba zapsána');
}

function addMemberTx(x, due, mb){
  S.tx.push({id:uid(), date:today(), type:'refund', amount:+mb.share, acc:shareAccOf(x), cat:x.cat, note:mb.name + ' – podíl ' + x.name, sub:x.id, due:due, member:mb.id});
}

function memberPay(sid, due, mid, quiet){
  var x = subById(sid); if (!x) return;
  var mb = (x.members || []).filter(function(m){ return m.id === mid; })[0]; if (!mb) return;
  var paid = memberTx(sid, due, mid);
  if (paid) {
    if (!confirm('Zrušit platbu od ' + mb.name + ' (' + dShort(due) + ')? Smaže se i zapsaná vratka.')) return;
    S.tx = S.tx.filter(function(t){ return t.id !== paid.id; });
    toast('Platba zrušena');
  } else {
    addMemberTx(x, due, mb);
    toast('Zapsáno: ' + mb.name + ' ' + NF.format(mb.share) + ' ' + S.currency);
  }
  save(); render(); if (!quiet) subDetail(sid);
}

function owedPay(i){
  var it = (ui.owedItems || [])[i]; if (!it) return;
  var x = subById(it.sid), mb = x && (x.members || []).filter(function(m){ return m.id === it.mid; })[0];
  if (!mb || memberTx(it.sid, it.due, it.mid)) return;
  addMemberTx(x, it.due, mb); save(); render(); owedSheet(ui.owedKey); toast('Zapsáno');
}

function owedPayAll(){
  var n = 0;
  (ui.owedItems || []).forEach(function(it){
    var x = subById(it.sid), mb = x && (x.members || []).filter(function(m){ return m.id === it.mid; })[0];
    if (mb && !memberTx(it.sid, it.due, it.mid)) { addMemberTx(x, it.due, mb); n++; }
  });
  save(); closeSheet(); render(); toast(zap(n,'platba','platby','plateb'));
}

function defCat(){ var c = S.cats.expense.filter(function(x){ return x.name === 'Předplatné'; })[0] || S.cats.expense[0]; return c ? c.id : ''; }

function subForm(id){
  if (!S.accounts.length) { toast('Nejdřív je potřeba přidat účet.'); accForm(); return; }
  var x = id ? subById(id) : null;
  if (x) {
    sd = JSON.parse(JSON.stringify(x));
    sd.amount = String(x.amount).replace('.', ',');
    sd.members = sd.members.map(function(m){ m.share = String(m.share).replace('.', ','); return m; });
    sd.active = !x.end;
  } else {
    sd = {id:null, name:'', ic:'more', icon:'🔁', amount:'', period:'month', first:today(), acc:defaultAcc(), cat:defCat(), auto:true, members:[], active:true};
  }
  subSheet();
}

function subCalc(){
  var f = document.getElementById('subf'), out = document.getElementById('myshare'); if (!f || !out) return;
  var a = parseAmt(f.elements.amount.value), sum = 0;
  f.querySelectorAll('.mrow .share').forEach(function(i){ var v = parseAmt(i.value); if (isFinite(v)) sum += v; });
  if (!isFinite(a)) { out.textContent = ''; return; }
  var mine = a - sum;
  out.innerHTML = f.querySelectorAll('.mrow').length ? 'Vlastní podíl: <b class="' + (mine < 0 ? 'neg' : '') + '">' + money(mine) + '</b>' : '';
}

function subAddMember(){ readSub(); sd.members.push({id:uid(), name:'', share:'', isNew:true}); subSheet(true); }

function subDelMember(i){ readSub(); sd.members.splice(i, 1); subSheet(); }

function subSplit(){
  readSub();
  var a = parseAmt(sd.amount);
  if (!isFinite(a) || a <= 0) { toast('Chybí částka.'); return; }
  var share = Math.round(a / (sd.members.length + 1) * 100) / 100;
  sd.members.forEach(function(m){ m.share = String(share).replace('.', ','); });
  subSheet();
}

function saveSub(e){
  e.preventDefault(); readSub();
  var d = sd, amount = parseAmt(d.amount), name = d.name.trim();
  if (!name) { toast('Chybí název.'); return; }
  if (!isFinite(amount) || amount <= 0) { toast('Chybí částka.'); return; }
  if (!d.first) { toast('Chybí datum.'); return; }
  var old = d.id ? subById(d.id) : null;
  var members = d.members.filter(function(m){ return m.name.trim(); }).map(function(m){
    var sh = parseAmt(m.share); var o = {id:m.id, name:m.name.trim(), share:isFinite(sh) ? Math.abs(Math.round(sh*100)/100) : 0};
    if (m.since) o.since = m.since;
    return o;
  });
  var sum = members.reduce(function(sm,m){ return sm + m.share; }, 0);
  if (sum > amount + 0.001) { toast('Podíly ostatních jsou vyšší než celá částka.'); return; }
  var x = {id:d.id || uid(), name:name, ic:d.ic || '', icon:d.icon || '🔁', amount:Math.round(amount*100)/100, period:d.period, first:d.first, acc:d.acc, shareAcc:(d.members.length && d.shareAcc) || d.acc, cat:d.cat,
           auto:!!d.auto, members:members, created:old ? old.created : today(), handled:old ? (old.handled || []).slice() : [], end:null};
  if (old) {
    x.end = d.active ? null : (old.end || today());
    // after editing, never backfill past payments automatically
    dues(x, today()).forEach(function(du){ if (x.handled.indexOf(du) < 0) x.handled.push(du); });
    var ld = lastDue(x);
    d.members.forEach(function(m){ if (m.isNew) { var mm = x.members.filter(function(z){ return z.id === m.id; })[0]; if (mm) mm.since = ld; } });
    var target = acc(x.shareAcc) ? x.shareAcc : x.acc, wrong = S.tx.filter(function(t){ return t.sub === x.id && t.member && t.type === 'refund' && t.acc !== target; });
    if (wrong.length && confirm('Přesunout ' + wrong.length + ' ' + pl(wrong.length, 'už zapsaný podíl', 'už zapsané podíly', 'už zapsaných podílů') + ' na účet ' + (acc(target) || {}).name + '?')) wrong.forEach(function(t){ t.acc = target; });
    S.subs = S.subs.map(function(z){ return z.id === x.id ? x : z; });
  } else {
    S.subs.push(x);
  }
  var n = processAuto();
  save(); render(); subDetail(x.id);
  toast(old ? 'Uloženo' : 'Platba přidána' + (n ? ', ' + zap(n,'platba','platby','plateb').toLowerCase() : ''));
}

function delSub(id){
  if (!confirm('Smazat tuto pravidelnou platbu? Už zapsané pohyby zůstanou v Pohybech.')) return;
  S.subs = S.subs.filter(function(z){ return z.id !== id; });
  save(); closeSheet(); render(); toast('Smazáno');
}

function defaultAcc(){
  if (S.lastAcc && acc(S.lastAcc)) return S.lastAcc;
  var l = S.accounts.filter(function(a){ return tinfo(a).g === 'liquid'; })[0];
  return (l || S.accounts[0]).id;
}

function addTx(type){
  if (!S.accounts.length) { toast('Nejdřív je potřeba přidat účet.'); accForm(); return; }
  draft = {id:null, type:type || 'expense', amount:'', acc:defaultAcc(), to:'', cat:'', date:today(), note:''};
  txSheet();
}

function editTx(id){
  var t = S.tx.filter(function(x){ return x.id === id; })[0]; if (!t) return;
  draft = Object.assign({}, t, {amount:String(t.amount).replace('.', ','), to:t.to || '', cat:t.cat || '', note:t.note || ''});
  txSheet();
}

function saveTx(e){
  if (e && e.preventDefault) e.preventDefault(); readDraft();
  var d = draft, amt = parseAmt(d.amount);
  if (!isFinite(amt) || amt === 0) { toast('Chybí částka.'); return; }
  if (d.type !== 'reval') amt = Math.abs(amt);
  if (!d.date) { toast('Chybí datum.'); return; }
  if ((d.type === 'expense' || d.type === 'income' || d.type === 'refund') && !d.cat) { toast('Chybí kategorie.'); return; }
  if (d.type === 'transfer' && (!d.to || d.to === d.acc)) { toast('Převod musí jít mezi dvěma různými účty.'); return; }
  var t = {id:d.id || uid(), date:d.date, type:d.type, amount:Math.round(amt*100)/100, acc:d.acc, note:(d.note || '').trim()};
  var ca = accCur(acc(t.acc));

function download(name, text, mime){
  var blob = new Blob([text], {type:mime});
  try {
    if (isIOS() && navigator.canShare && typeof File === 'function') {
      var file = new File([blob], name, {type:mime});
      if (navigator.canShare({files:[file]})) { return navigator.share({files:[file], title:name}).then(function(){ return true; }, function(){ return false; }); }
    }
  } catch(e) {}
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 2000);
  return Promise.resolve(true);
}
