:root{
  --bg:#F4F2EC; --surface:#FFFFFF; --ink:#191C24; --muted:#5F6470; --faint:#A9A497;
  --line:#E2DED4; --line2:#D6D1C5; --rule:#EFECE5; --sel:#EAE6DC;
  --blue:#3346C9; --on-blue:#FFFFFF; --lime:#C9EE6B; --green:#1D7348; --red:#B9381F; --orange:#B4531F;
  --warn-bg:#FBF1E8; --warn-line:#EBCFB8; --warn-ink:#6B2F0E; --warn-strong:#8A3D12; --ok-bg:#E3F1E8;
  --card:#191C24; --card-ink:#F4F2EC; --card-mute:#B9BDC7; --card-dim:#8D92A0; --card-sub:#262A35; --card-line:#333846; --card-bar:#E9E6DE; --card-future:#3A3F4C;
  --shadow:0 8px 18px rgba(51,70,201,.32);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111318; --surface:#1A1D24; --ink:#ECEAE4; --muted:#9BA0AB; --faint:#6C717C;
    --line:#2A2E37; --line2:#363B46; --rule:#23272F; --sel:#262A33;
    --blue:#8D9BFF; --on-blue:#111318; --lime:#C9EE6B; --green:#5CC08A; --red:#F0806A; --orange:#F0A06A;
    --warn-bg:#2A1F17; --warn-line:#4A3424; --warn-ink:#F2C4A2; --warn-strong:#F2A774; --ok-bg:#1C3326;
    --card:#22252E; --card-ink:#F4F2EC; --card-mute:#B9BDC7; --card-dim:#8D92A0; --card-sub:#2E323C; --card-line:#3A3F4A; --card-bar:#E9E6DE; --card-future:#3A3F4C;
    --shadow:0 8px 18px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.disp{font-family:Bricolage,Manrope,system-ui,sans-serif}
.pos{color:var(--green)} .neg{color:var(--red)} .mute{color:var(--muted)} .warn{color:var(--orange)}
.small{font-size:13px} .center{text-align:center}
svg.i{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex:none}

#banner{background:var(--red);color:#fff;font-size:14px;padding:10px 20px;text-align:center}
main{max-width:600px;margin:0 auto;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}

/* header */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 12px 10px 20px}
header.top h1{margin:0;font-family:Bricolage,Manrope,sans-serif;font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
header.top .acts{display:flex;align-items:center;gap:2px}
header.top.back{padding-left:8px}
header.top.back .ttl{display:flex;align-items:center;gap:2px}
.iconbtn{appearance:none;border:0;background:transparent;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--ink);flex:none}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}

.sheet .chartbox .ro{font-size:12px;color:var(--muted);text-align:right;min-height:17px}

.tgrid button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.amtbig{text-align:center;padding:16px 0 8px;font-family:Bricolage,Manrope,sans-serif;font-size:52px;font-weight:700;letter-spacing:-.035em;line-height:1;overflow-wrap:anywhere}
.amtbig .k{font-size:24px;color:var(--muted);font-weight:600;margin-left:6px}
.amthint{font-size:13px;color:var(--muted);text-align:center;margin:0 8px 8px}
.pchips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}

.abox .v{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cats{display:flex;gap:6px;margin:14px -16px 0;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none;flex:none}

.cchip{appearance:none;flex:none;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 9px;border-radius:22px;font-size:14px;font-weight:700;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.cchip .ct{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:14px}

.keys button:active{background:var(--sel)}
.cta{margin-top:10px}
.linkbtn{appearance:none;border:0;background:transparent;color:var(--red);font-size:14px;font-weight:700;display:block;margin:10px auto 0;padding:6px 10px}
.icpick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.icpick button{appearance:none;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icpick button.on{border:2px solid var(--ink)}
.mrow{display:flex;gap:8px;margin-top:8px;align-items:center}
.mrow .inp.share{width:110px;flex:none}
.xbtn{appearance:none;border:0;background:var(--surface);border:1px solid var(--line);color:var(--muted);width:44px;height:48px;border-radius:14px;font-size:20px;flex:none}
.btns2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:22px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:88vw;text-align:center}

function ic(name, size, sw){

function mixHex(c, w, t){
  var a = parseInt(c.slice(1), 16), b = parseInt(w.slice(1), 16);
  var r = (a >> 16) & 255, g = (a >> 8) & 255, bl = a & 255;
  r = Math.round(r + (((b >> 16) & 255) - r) * t); g = Math.round(g + (((b >> 8) & 255) - g) * t); bl = Math.round(bl + ((b & 255) - bl) * t);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
}
function tint(c){ return DARK ? {fg:mixHex(c, '#ffffff', 0.45), bg:c + '4D'} : {fg:c, bg:c + '1A'}; }
function tileHtml(c, inner, cls){ var t = tint(c); return '<span class="tile' + (cls ? ' ' + cls : '') + '" style="color:' + t.fg + ';background:' + t.bg + '">' + inner + '</span>'; }
function hashStr(s){ var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
function catStyle(c){
  if (!c) return {ic:'more', col:'#5F6470'};

  return st ? {ic:st[0], col:st[1]} : {emo:c.icon || '🏷️', col:PALETTE[hashStr(c.name) % PALETTE.length]};
}
function catTile(c, cls){ var st = catStyle(c); return tileHtml(st.col, st.ic ? ic(st.ic, cls === 'sm' ? 17 : 20) : '<span>' + esc(st.emo) + '</span>', cls); }
function subTile(x, cls){

  return tileHtml('#5F6470', '<span>' + esc(x.icon || '🔁') + '</span>', cls);
}

function dayHead(s){
  var d = parseD(s), y = new Date(); y.setDate(y.getDate() - 1);
  var wd = d.toLocaleDateString('cs-CZ', {weekday:'long'});
  var dm = d.getDate() + '. ' + (d.getMonth() + 1) + '.' + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
  if (s === today()) return 'Dnes · ' + wd + ' ' + dm;
  if (s === fmtD(y)) return 'Včera · ' + wd + ' ' + dm;
  return wd[0].toUpperCase() + wd.slice(1) + ' ' + dm;
}
function dateLbl(d){
  if (d === today()) return 'Dnes';

function isIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1); }
function isStandalone(){ return navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }

function backupNotice(){
  if (S.tx.length < 5) return '';

}
function txRow(t, ctx){
  var a = acc(t.acc), tile, title, sub, amt, col = '', c;
  if (t.type === 'transfer') {
    var b = acc(t.to), inn = ctx && t.to === ctx;
    tile = tileHtml('#5F6470', ic('swap')); title = t.note ? esc(t.note) : 'Převod';
    if (ctx) { sub = dShort(t.date) + ' · ' + (inn ? 'z účtu ' + esc(a ? a.name : '?') : 'na ' + esc(b ? b.name : '?')); amt = money(inn ? t.amount : -t.amount, true); col = inn ? 'pos' : ''; }
    else { sub = esc((a ? a.name : '?') + ' → ' + (b ? b.name : '?')); amt = money(t.amount); col = 'mute'; }
  } else if (t.type === 'reval') {
    tile = tileHtml(t.amount >= 0 ? '#1D7348' : '#B9381F', ic('chart'));
    title = esc(t.note || 'Změna hodnoty'); sub = ctx ? dShort(t.date) : esc(a ? a.name : '');
    amt = money(t.amount, true); col = t.amount >= 0 ? 'pos' : 'neg';
  } else if (t.type === 'refund') {
    c = cat(t.cat);
    var sx = t.sub ? subById(t.sub) : null, extra = '';
    if (t.sub && t.due && !myTx(t.sub, t.due)) extra = 'podíl předem';
    tile = tileHtml(catStyle(c).col, ic('undo'));
    title = 'Vratka · ' + esc(sx ? sx.name : (c ? c.name : ''));
    sub = esc([ctx ? dShort(t.date) : '', extra, t.note, ctx ? '' : (a && a.name)].filter(Boolean).join(' · '));
    amt = money(t.amount, true); col = 'pos';
  } else {
    c = cat(t.cat);
    tile = catTile(c); title = esc(c ? c.name : 'Bez kategorie');
    sub = esc([ctx ? dShort(t.date) : '', t.note, ctx ? '' : (a && a.name)].filter(Boolean).join(' · '));
    amt = t.type === 'expense' ? money(-t.amount) : money(t.amount, true);
    col = t.type === 'income' ? 'pos' : '';
  }
  return '<button class="row" onclick="App.editTx(\'' + t.id + '\')">' + tile + '<span class="main"><span class="t">' + title + '</span><span class="s">' + (sub || '&nbsp;') + '</span></span><span class="amt ' + col + '">' + amt + '</span></button>';
}

/* ---------- charts ---------- */
function lineChart(id, ser, opts){
  opts = opts || {};
  var dates = ser.dates, vals = ser.vals, n = vals.length;
  if (n < 2) return '<div class="small" style="color:' + (opts.plain ? 'var(--muted)' : 'var(--card-dim)') + ';padding:22px 0 10px;text-align:center">Graf se zobrazí s daty alespoň ze dvou dnů.</div>';
  var W = 322, H = 96, P = 5;
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if (mn === mx) { var p0 = Math.abs(mn) * 0.05 || 1; mn -= p0; mx += p0; }
  function X(i){ return P + (W - 2 * P) * i / (n - 1); }
  function Y(v){ return 6 + (H - 12) * (1 - (v - mn) / (mx - mn)); }
  charts[id] = {dates:dates, vals:vals, X:X, Y:Y, W:W, P:P, n:n, mask:!!opts.mask};
  var col = opts.plain ? 'var(--blue)' : 'var(--lime)', dot = opts.plain ? 'var(--surface)' : 'var(--card)';
  var line = 'M' + vals.map(function(v, i){ return X(i).toFixed(1) + ' ' + Y(v).toFixed(1); }).join('L');
  var area = line + 'L' + X(n - 1).toFixed(1) + ' ' + H + 'L' + X(0).toFixed(1) + ' ' + H + 'Z';
  return '<svg class="lc" id="' + id + '" data-chart="' + id + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Vývoj hodnoty v čase">' +
    '<path d="' + area + '" style="fill:' + col + ';fill-opacity:.12"/>' +
    '<path d="' + line + '" style="fill:none;stroke:' + col + ';stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round"/>' +
    '<line class="guide" x1="0" x2="0" y1="0" y2="' + H + '" style="display:none;stroke:' + col + ';stroke-opacity:.45;stroke-width:1"/>' +
    '<circle class="mk" r="4.5" cx="' + X(n - 1).toFixed(1) + '" cy="' + Y(vals[n - 1]).toFixed(1) + '" style="fill:' + dot + ';stroke:' + col + ';stroke-width:2.2"/></svg>';
}
function bindCharts(root){
  (root || document).querySelectorAll('svg[data-chart]').forEach(function(svg){
    if (svg._bound) return; svg._bound = true;
    var c = charts[svg.getAttribute('data-chart')]; if (!c) return;
    var g = svg.querySelector('.guide'), mk = svg.querySelector('.mk'), ro = document.getElementById(svg.id + '-ro');
    function show(i){
      var x = c.X(i), y = c.Y(c.vals[i]);
      mk.setAttribute('cx', x); mk.setAttribute('cy', y); g.setAttribute('x1', x); g.setAttribute('x2', x); g.style.display = '';
      if (ro) ro.innerHTML = dShort(c.dates[i]) + ' · ' + (c.mask && hidden() ? '•••••' : money(c.vals[i]));
    }
    function move(e){
      var r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * c.W;
      show(Math.max(0, Math.min(c.n - 1, Math.round((px - c.P) / (c.W - 2 * c.P) * (c.n - 1)))));
    }
    function reset(){ var i = c.n - 1; mk.setAttribute('cx', c.X(i)); mk.setAttribute('cy', c.Y(c.vals[i])); g.style.display = 'none'; if (ro) ro.innerHTML = ''; }
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerdown', move);
    svg.addEventListener('pointerleave', function(e){ if (e.pointerType === 'mouse') reset(); });
    svg.addEventListener('pointercancel', reset);
  });
}

function dayNet(ym){
  var y = +ym.slice(0, 4), m = +ym.slice(5, 7), dim = new Date(y, m, 0).getDate(), arr = [], pm = myPayMap(), i;
  for (i = 0; i < dim; i++) arr.push(0);
  S.tx.forEach(function(t){
    if (t.type !== 'expense' && t.type !== 'refund') return;
    var d = statDate(t, pm); if (!d || d.slice(0, 7) !== ym) return;
    arr[+d.slice(8, 10) - 1] += t.type === 'expense' ? +t.amount : -t.amount;
  });
  return arr.map(function(v){ return Math.max(0, v); });
}
function spendCard(ym){
  var m = monthStats(ym), arr = dayNet(ym), t = today(), cur = ym === t.slice(0, 7);
  var td = cur ? +t.slice(8, 10) : (ym < t.slice(0, 7) ? 99 : 0), dim = arr.length, mon = +ym.slice(5, 7);
  var mx = Math.max.apply(null, arr.concat([1]));
  var bars = arr.map(function(v, i){
    var d = i + 1;
    if (d > td) return '<i style="height:3px;background:var(--card-future)"></i>';
    return '<i style="height:' + Math.max(3, Math.round(v / mx * 44)) + 'px;background:' + (cur && d === td ? 'var(--lime)' : 'var(--card-bar)') + '"></i>';
  }).join('');
  var left = m.inc - m.exp;
  var line = m.inc > 0 ? 'z příjmů ' + money(m.inc) + ' · ' + (left >= 0 ? 'zbývá <span class="hl">' + money(left) + '</span>' : 'přečerpáno <span class="hl-warn">' + money(-left) + '</span>') : (m.exp ? 'bez příjmů' : '&nbsp;');
  var labels = '<div class="dlabels"><span style="left:0">1. ' + mon + '.</span>' +
    (cur && td > 4 && td < dim - 3 ? '<span class="today" style="left:' + ((td - 0.5) / dim * 100).toFixed(1) + '%">dnes</span>' : '') +
    '<span style="right:0">' + dim + '. ' + mon + '.</span></div>';
  return '<section class="hcard spend"><div class="mnav"><button onclick="App.month(\'tx\',-1)" aria-label="Předchozí měsíc">' + ic('chevL', 18, 2.2) + '</button><span>' + ymLabel(ym) + '</span><button onclick="App.month(\'tx\',1)" aria-label="Další měsíc">' + ic('chevR', 18, 2.2) + '</button></div>' +
    '<div class="inner"><div class="lbl">Utraceno</div><div class="big">' + bigMoney(m.exp) + '</div><div class="line">' + line + '</div>' +
    '<div class="dbars" role="img" aria-label="Výdaje po dnech">' + bars + '</div>' + labels + '</div></section>';
}

function txListHtml(){

      return [t.note, c && c.name, a && a.name, b && b.name, sx && sx.name, String(t.amount)].some(function(s){ return s && String(s).toLowerCase().indexOf(q) >= 0; });
    });
  } else if (ui.search) {

    items = S.tx.filter(function(t){ return t.date.slice(0, 7) === ui.txMonth; });
  }
  if (ui.txFilter !== 'all') items = items.filter(function(t){
    return ui.txFilter === 'transfer' ? (t.type === 'transfer' || t.type === 'reval') : ui.txFilter === 'expense' ? (t.type === 'expense' || t.type === 'refund') : t.type === ui.txFilter;

/* ---------- Statistiky ---------- */
function monthStatsUpTo(ym, day){
  var m = {inc:0, exp:0, byCat:{}}, pm = myPayMap();
  S.tx.forEach(function(t){
    var sdt = statDate(t, pm);
    if (!sdt || sdt.slice(0, 7) !== ym || +sdt.slice(8, 10) > day) return;
    var v = +t.amount || 0, k = t.cat || 'none';
    if (t.type === 'expense') { m.exp += v; m.byCat[k] = (m.byCat[k] || 0) + v; }
    else if (t.type === 'refund') { m.exp -= v; m.byCat[k] = (m.byCat[k] || 0) - v; }
    else if (t.type === 'income') m.inc += v;
  });
  return m;
}
function vStats(){
  if (!S.accounts.length) return hdr('Statistiky') + vEmptyBody();

  var nm = ymLabel(ym); if (ym.slice(0, 4) === today().slice(0, 4)) nm = nm.split(' ')[0];

  var curM = ym === curYM(), upto = curM ? +today().slice(8, 10) : 99, hist = [];
  for (i = 1; i <= 6; i++) { var hy = addMonths(ym, -i), hs = monthStats(hy); if (hs.exp || hs.inc) hist.push(curM ? monthStatsUpTo(hy, upto) : hs); }
  var cmp = curM ? 'než průměr předchozích měsíců ke stejnému dni' : 'než průměr předchozích měsíců';
  var avgExp = hist.length ? hist.reduce(function(a, s){ return a + s.exp; }, 0) / hist.length : 0;
  var catAvg = {};
  hist.forEach(function(s){ Object.keys(s.byCat).forEach(function(k){ catAvg[k] = (catAvg[k] || 0) + s.byCat[k] / hist.length; }); });
  var list = Object.keys(m.byCat).map(function(k){ return {id:k, v:m.byCat[k], c:cat(k)}; }).filter(function(x){ return x.v > 0.005; }).sort(function(a, b){ return b.v - a.v; });
  var ins;
  if (!m.exp) ins = 'V tomto měsíci zatím žádné výdaje.';
  else if (!hist.length || avgExp <= 0) ins = 'Zatím málo dat pro srovnání s předchozími měsíci.';
  else {
    var d = (m.exp - avgExp) / avgExp;
    ins = Math.abs(d) < 0.03 ? 'Výdaje na úrovni průměru předchozích měsíců' + (curM ? ' ke stejnému dni.' : '.')
      : 'Výdaje o <b class="' + (d < 0 ? 'hl' : 'hl-warn') + '">' + Math.round(Math.abs(d) * 100) + '\u00a0% ' + (d < 0 ? 'nižší' : 'vyšší') + '</b> ' + cmp + '.';
    var best = null;
    list.forEach(function(x){ var av = catAvg[x.id] || 0; if (av > 0 && x.v - av > 200) { var r = (x.v - av) / av; if (!best || r > best.r) best = {x:x, r:r}; } });
    if (best) ins += ' Nejvíc vzrostla kategorie <b>' + esc(best.x.c ? best.x.c.name : 'Bez kategorie') + '</b>, o ' + Math.round(best.r * 100) + '\u00a0%.';
  }

    '<section class="hcard"><div class="insight"><span class="ib">' + ic('trend', 20, 2) + '</span><span>' + ins + '</span></div>' +
    '<div class="row3"><div><div class="k">Příjmy</div><div class="v">' + money(m.inc) + '</div></div><div><div class="k">Výdaje</div><div class="v">' + money(m.exp) + '</div></div>' +
    '<div><div class="k">Ušetřeno</div><div class="v" style="color:' + (sr === null ? 'inherit' : sr >= 0 ? 'var(--lime)' : '#FFB38A') + '">' + (sr === null ? '–' : Math.round(sr * 100) + '\u00a0%') + '</div></div></div></section>';
  h += '<div class="sh"><h2>Kategorie</h2>' + (hist.length && list.length ? '<span class="r">' + (curM ? 'proti průměru ke stejnému dni' : 'proti průměru ' + hist.length + ' ' + pl(hist.length, 'měsíce', 'měsíců', 'měsíců')) + '</span>' : '') + '</div>';

        else { var dd = (x.v - av) / av; if (Math.abs(dd) < 0.03) tr = 'stejně'; else if (dd > 0) { tr = '↑ ' + Math.round(dd * 100) + '\u00a0%'; if (dd > 0.1) tc = 'var(--orange)'; } else { tr = '↓ ' + Math.round(-dd * 100) + '\u00a0%'; tc = 'var(--green)'; } }

  if (inc.length) {

      return '<div class="row">' + catTile(x.c, 'sm') + '<span class="main"><span class="t">' + esc(x.c ? x.c.name : 'Bez kategorie') + '</span></span><span class="amt pos">' + money(x.v) + '</span></div>';
    }).join('') + '</div>';
  }
  var data = [], mx = 1;
  for (i = 11; i >= 0; i--) { var y2 = addMonths(curYM(), -i), s2 = monthStats(y2); data.push({ym:y2, inc:s2.inc, exp:Math.max(0, s2.exp)}); mx = Math.max(mx, s2.inc, s2.exp); }

    var on = dm.ym === ym, mo = +dm.ym.slice(5, 7) - 1;

  }).join('') + '</div><div class="legend"><span><i style="background:var(--green)"></i>Příjmy</span><span><i style="background:var(--ink)"></i>Výdaje</span></div></div>';
  return h;

function occRow(x, d, isNext){

    : '<span class="st' + (dd <= 1 ? ' warn' : '') + '">' + (dd === 0 ? 'dnes' : dd === 1 ? 'zítra' : 'za ' + dd + ' ' + pl(dd, 'den', 'dny', 'dní')) + '</span>';

var CTA = {expense:'Přidat výdaj', income:'Přidat příjem', transfer:'Převést', refund:'Přidat vratku', reval:'Uložit'};
function prettyAmt(a){
  a = String(a || '0'); var neg = a.charAt(0) === '-'; if (neg) a = a.slice(1);
  var p = a.split(','), ip = (p[0] || '0').replace(/^0+(?=\d)/, '');
  ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0');
  return (neg ? '−' : '') + ip + (p.length > 1 ? ',' + p[1] : '');
}
function amtHtml(d){
  var v = parseAmt(d.amount), nz = isFinite(v) && v !== 0;
  var sign = !nz ? '' : d.type === 'expense' ? '−' : (d.type === 'income' || d.type === 'refund') ? '+' : '';
  return sign + prettyAmt(d.amount) + '<span class="k">' + esc(S.currency) + '</span>';
}
function amtColor(d){ return (d.type === 'income' || d.type === 'refund') ? 'var(--green)' : 'var(--ink)'; }
function ctaText(d){
  var v = parseAmt(d.amount);
  return (d.id ? 'Uložit' : CTA[d.type]) + (isFinite(v) && v !== 0 ? ' · ' + prettyAmt(d.amount) + '\u00a0' + S.currency : '');
}
function catsSorted(kind){
  var list = kind === 'income' ? S.cats.income : S.cats.expense, cnt = {}, lim = fmtD(new Date(Date.now() - 180 * 864e5));
  S.tx.forEach(function(t){ if (t.cat && t.date >= lim) cnt[t.cat] = (cnt[t.cat] || 0) + 1; });
  return list.map(function(c, i){ return {c:c, i:i, n:cnt[c.id] || 0}; }).sort(function(a, b){ return b.n - a.n || a.i - b.i; }).map(function(o){ return o.c; });
}
function txSheet(){
  var d = draft, isR = d.type === 'reval', linked = d.sub ? subById(d.sub) : null, A = acc(d.acc);
  function opts(sel){ return S.accounts.map(function(a){ return '<option value="' + a.id + '"' + (a.id === sel ? ' selected' : '') + '>' + esc(a.name) + '</option>'; }).join(''); }
  if (d.type === 'transfer' && (!d.to || d.to === d.acc)) d.to = (S.accounts.filter(function(a){ return a.id !== d.acc; })[0] || {}).id || '';
  var cats = (d.type === 'expense' || d.type === 'refund') ? catsSorted('expense') : d.type === 'income' ? catsSorted('income') : [];
  var hint = d.type === 'refund' ? 'Vrácené peníze. Sníží výdaje ve zvolené kategorii.' : isR ? 'Přecenění nebo srovnání zůstatku. Nepočítá se do příjmů ani výdajů.' : '';
  if (linked) hint = (hint ? hint + ' ' : '') + 'Patří k platbě ' + esc(linked.name) + ' (' + dShort(d.due) + ').';
  var h = '<div class="shead"><h3>' + (d.id ? (isR ? 'Změna hodnoty' : 'Upravit pohyb') : 'Nový pohyb') + '</h3><button class="iconbtn" onclick="App.closeSheet()" aria-label="Zavřít">' + ic('x', 22, 2) + '</button></div>';

    return '<button class="' + (d.type === x[0] ? 'on' : '') + '" aria-pressed="' + (d.type === x[0]) + '" onclick="App.setTxType(\'' + x[0] + '\')">' + x[1] + '</button>';

  h += '<div class="amtbig" id="amtBig" style="color:' + amtColor(d) + '">' + amtHtml(d) + '</div>';

  h += '<label class="pchip">' + ic('calendar', 16) + '<span id="dateLbl">' + dateLbl(d.date) + '</span><input type="date" aria-label="Datum" value="' + esc(d.date) + '" onchange="App.txSet(\'date\',this.value)"></label>';
  if (!d.noteOpen && !d.note) h += '<button class="pchip dash" onclick="App.txNote()">+ Poznámka</button>';
  if (isR) h += '<button class="pchip" onclick="App.txSign()">± Znaménko</button>';
  h += '</div>';
  if (d.type === 'transfer') {
    h += '<div class="xfer"><label class="abox"><span class="k">Z účtu</span><span class="v" id="accLbl">' + esc(A ? A.name : '') + '</span><select aria-label="Z účtu" onchange="App.txSet(\'acc\',this.value)">' + opts(d.acc) + '</select></label>' +
      '<span class="mute">' + ic('chevR', 18, 2) + '</span>' +
      '<label class="abox"><span class="k">Na účet</span><span class="v" id="toLbl">' + esc((acc(d.to) || {}).name || '') + '</span><select aria-label="Na účet" onchange="App.txSet(\'to\',this.value)">' + opts(d.to) + '</select></label></div>';

function readDraft(){ var n = document.getElementById('noteIn'); if (n && draft) draft.note = n.value; }

  if (f === 'to') { var t = document.getElementById('toLbl'); if (t) t.textContent = (acc(v) || {}).name || ''; }

function txSign(){ var a = String(draft.amount || ''); draft.amount = a.charAt(0) === '-' ? a.slice(1) : '-' + a; updAmt(); }

  var e = document.getElementById('amtBig'); if (e) { e.innerHTML = amtHtml(draft); e.style.color = amtColor(draft); }
  var c = document.getElementById('cta'); if (c) c.textContent = ctaText(draft);

function key(k){
  if (!draft) return;
  var a = String(draft.amount || ''), neg = a.charAt(0) === '-';
  if (neg) a = a.slice(1);
  if (a === '0') a = '';
  if (k === 'del') a = a.slice(0, -1);
  else if (k === ',') { if (a.indexOf(',') < 0) a = (a || '0') + ','; }
  else { var p = a.split(','); if (p.length > 1) { if (p[1].length < 2) a += k; } else if (p[0].replace(/\D/g, '').length < 9) a += k; }
  draft.amount = (neg && a ? '-' : '') + a;
  updAmt();
}

/* ---------- helpers ---------- */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtD(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function today(){ return fmtD(new Date()); }
function parseD(s){ var p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function curYM(){ return today().slice(0,7); }
function addMonths(ym, n){ var p = ym.split('-').map(Number); var d = new Date(p[0], p[1]-1+n, 1); return d.getFullYear() + '-' + pad(d.getMonth()+1); }
function ymLabel(ym){ var p = ym.split('-').map(Number); var s = MONTHS[p[1]-1]; return s[0].toUpperCase() + s.slice(1) + ' ' + p[0]; }
function monthEnd(ym){ var p = ym.split('-').map(Number); return fmtD(new Date(p[0], p[1], 0)); }
function dShort(s){ var d = parseD(s); return d.getDate() + '. ' + (d.getMonth()+1) + '. ' + d.getFullYear(); }
function dayLabel(s){
  if (s === today()) return 'Dnes';
  var y = new Date(); y.setDate(y.getDate()-1);
  if (s === fmtD(y)) return 'Včera';
  var d = parseD(s), wd = d.toLocaleDateString('cs-CZ', {weekday:'long'});
  return wd[0].toUpperCase() + wd.slice(1) + ' ' + d.getDate() + '. ' + (d.getMonth()+1) + '.' + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
function daysBetween(a, b){ return Math.round((parseD(b) - parseD(a)) / 864e5); }
function pl(n, a, b, c){ return n === 1 ? a : (n >= 2 && n <= 4 ? b : c); }
function zap(n, a, b, c){ return pl(n,'Zapsána','Zapsány','Zapsáno') + ' ' + n + ' ' + pl(n, a, b, c); }

var NF = new Intl.NumberFormat('cs-CZ', {maximumFractionDigits:2});
var NFC;
try { NFC = new Intl.NumberFormat('cs-CZ', {notation:'compact', maximumFractionDigits:1}); } catch(e) { NFC = null; }
function money(n, sign){
  var r = Math.round(n*100)/100, p = '';
  if (r < 0) p = '−'; else if (sign && r > 0) p = '+';
  return p + NF.format(Math.abs(r)) + '\u00a0' + esc(S.currency);
}
function compact(n){
  if (NFC) return NFC.format(n);
  var a = Math.abs(n);
  if (a >= 1e6) return (n/1e6).toFixed(1).replace('.', ',') + ' mil.';
  if (a >= 1e3) return Math.round(n/1e3) + ' tis.';
  return String(Math.round(n));
}
function pct(x){ return (x*100).toFixed(0) + '\u00a0%'; }
function parseAmt(s){
  if (typeof s === 'number') return s;
  var v = parseFloat(String(s || '').replace(/[\s\u00a0]/g,'').replace(',', '.').replace('−','-'));
  return isFinite(v) ? v : NaN;
}
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('on'); }, 2600);
}
function sortTx(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : (a.id < b.id ? 1 : -1); }

/* ---------- storage ---------- */
function defaultState(){
  return {
    v:1, currency:'Kč', accounts:[], tx:[], subs:[], lastBackup:null, lastAcc:null, hideWealth:true,
    cats:{
      expense: DEF_CATS.expense.map(function(c,i){ return {id:'e'+i, name:c[0], icon:c[1]}; }),
      income: DEF_CATS.income.map(function(c,i){ return {id:'i'+i, name:c[0], icon:c[1]}; })
    }
  };
}
function normalize(s){
  var d = defaultState();
  if (!s || typeof s !== 'object') return d;
  var out = Object.assign({}, d, s);
  out.cats = {
    expense: s.cats && Array.isArray(s.cats.expense) ? s.cats.expense : d.cats.expense,
    income: s.cats && Array.isArray(s.cats.income) ? s.cats.income : d.cats.income
  };
  out.accounts = Array.isArray(s.accounts) ? s.accounts : [];
  out.tx = Array.isArray(s.tx) ? s.tx : [];
  out.subs = Array.isArray(s.subs) ? s.subs : [];
  if (!out.currency) out.currency = 'Kč';
  return out;
}

  if (raw) { try { s = JSON.parse(raw); } catch(e) {} }

}

/* ---------- data logic ---------- */
function acc(id){ for (var i=0;i<S.accounts.length;i++) if (S.accounts[i].id === id) return S.accounts[i]; return null; }
function cat(id){
  if (!id) return null;
  var all = S.cats.expense.concat(S.cats.income);
  for (var i=0;i<all.length;i++) if (all[i].id === id) return all[i];
  return null;
}
function tinfo(a){ return TYPES[a && a.type] || TYPES.bank; }

function balances(upTo){
  var b = {};
  S.accounts.forEach(function(a){ b[a.id] = (!upTo || a.start <= upTo) ? (+a.initial || 0) : 0; });
  S.tx.forEach(function(t){
    if (upTo && t.date > upTo) return;
    var v = +t.amount || 0;
    if (t.type === 'expense') { if (t.acc in b) b[t.acc] -= v; }
    else if (t.type === 'income' || t.type === 'reval' || t.type === 'refund') { if (t.acc in b) b[t.acc] += v; }
    else if (t.type === 'transfer') { if (t.acc in b) b[t.acc] -= v; if (t.to in b) b[t.to] += v; }
  });
  return b;
}
function netWorth(upTo){
  var b = balances(upTo), s = 0;
  for (var k in b) s += b[k];
  return s;
}
/* Shares from other people (refunds linked to a recurring payment) count in the month of
   the payment they belong to, and only once that payment is recorded. */
function myPayMap(){
  var m = {};
  S.tx.forEach(function(t){ if (t.type === 'expense' && t.sub && t.due && !t.member) m[t.sub + '|' + t.due] = t; });
  return m;
}
function statDate(t, pm){
  if (t.type === 'refund' && t.sub && t.due) { var e = pm[t.sub + '|' + t.due]; return e ? e.date : null; }
  return t.date;
}
function monthStats(ym){
  var m = {inc:0, exp:0, reval:0, byCat:{}, byInc:{}}, pm = myPayMap();
  S.tx.forEach(function(t){
    var sdt = statDate(t, pm);
    if (!sdt || sdt.slice(0,7) !== ym) return;
    var v = +t.amount || 0, k = t.cat || 'none';
    if (t.type === 'expense') { m.exp += v; m.byCat[k] = (m.byCat[k] || 0) + v; }
    else if (t.type === 'refund') { m.exp -= v; m.byCat[k] = (m.byCat[k] || 0) - v; }
    else if (t.type === 'income') { m.inc += v; m.byInc[k] = (m.byInc[k] || 0) + v; }
    else if (t.type === 'reval') { m.reval += v; }
  });
  return m;
}
/* Time series of net worth (or one account's balance) */
function series(months, accId){
  var ev = [], t = today();
  var accs = accId ? S.accounts.filter(function(a){ return a.id === accId; }) : S.accounts;
  accs.forEach(function(a){ ev.push([a.start, +a.initial || 0]); });
  S.tx.forEach(function(x){
    var v = +x.amount || 0, d = 0;
    if (accId) {
      if (x.acc === accId) d += (x.type === 'income' || x.type === 'reval' || x.type === 'refund') ? v : -v;
      if (x.type === 'transfer' && x.to === accId) d += v;
    } else {
      d = x.type === 'expense' ? -v : (x.type === 'income' || x.type === 'reval' || x.type === 'refund') ? v : 0;
    }
    if (d) ev.push([x.date, d]);
  });
  ev.sort(function(a,b){ return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0; });
  var start = t;
  ev.forEach(function(e){ if (e[0] < start) start = e[0]; });
  if (months) { var dd = new Date(); dd.setMonth(dd.getMonth() - months); var s = fmtD(dd); if (s > start) start = s; }
  var days = daysBetween(start, t), dates = [], d, i;
  if (days <= 92) {
    d = parseD(t);
    for (i = 0; i <= days; i++) { dates.push(fmtD(d)); d.setDate(d.getDate()-1); }
  } else if (days <= 750) {
    d = parseD(t);
    while (fmtD(d) > start) { dates.push(fmtD(d)); d.setDate(d.getDate()-7); }
    dates.push(start);
  } else {
    dates.push(t);
    var ym = addMonths(t.slice(0,7), -1);
    while (monthEnd(ym) > start) { dates.push(monthEnd(ym)); ym = addMonths(ym, -1); }
    dates.push(start);
  }
  dates.reverse();
  var j = 0, sum = 0;
  var vals = dates.map(function(dt){ while (j < ev.length && ev[j][0] <= dt) { sum += ev[j][1]; j++; } return sum; });
  return {dates:dates, vals:vals};
}


/* ---------- recurring payments ---------- */
var PERIODS = {
  week:{n:'Týdně', m:0, f:52/12},
  month:{n:'Měsíčně', m:1, f:1},
  quarter:{n:'Čtvrtletně', m:3, f:1/3},
  half:{n:'Pololetně', m:6, f:1/6},
  year:{n:'Ročně', m:12, f:1/12}
};
var sd = null;
function subById(id){ return (S.subs || []).filter(function(x){ return x.id === id; })[0] || null; }
function dueAt(sub, k){
  var d0 = parseD(sub.first);
  if (sub.period === 'week') { var d = new Date(d0); d.setDate(d.getDate() + 7*k); return fmtD(d); }
  var y = d0.getFullYear(), mo = d0.getMonth() + (PERIODS[sub.period] || PERIODS.month).m*k, day = d0.getDate();
  var dim = new Date(y, mo+1, 0).getDate();
  return fmtD(new Date(y, mo, Math.min(day, dim)));
}
function dues(sub, until){
  var out = [], lim = sub.end && sub.end < until ? sub.end : until;
  for (var k = 0; k < 2000; k++) { var d = dueAt(sub, k); if (d > lim) break; out.push(d); }
  return out;
}
function nextDue(sub){
  if (sub.end) return null;
  var t = today();
  for (var k = 0; k < 2000; k++) { var d = dueAt(sub, k); if (d >= t) return d; }
  return null;
}
function lastDue(sub){ var p = dues(sub, today()); return p.length ? p[p.length-1] : sub.first; }
function myShare(sub){ return (+sub.amount || 0) - (sub.members || []).reduce(function(sm,m){ return sm + (+m.share || 0); }, 0); }
function myTx(sid, due){ return S.tx.filter(function(t){ return t.sub === sid && t.due === due && !t.member; })[0] || null; }
function memberTx(sid, due, mid){ return S.tx.filter(function(t){ return t.sub === sid && t.due === due && t.member === mid; })[0] || null; }
function memberDues(sub, mb, until){ return dues(sub, until).filter(function(d){ return !mb.since || d >= mb.since; }); }
function owed(){
  var map = {}, t = today();
  (S.subs || []).forEach(function(sub){
    (sub.members || []).forEach(function(mb){
      memberDues(sub, mb, t).forEach(function(due){
        if (memberTx(sub.id, due, mb.id)) return;
        var key = mb.name.trim().toLowerCase();
        if (!map[key]) map[key] = {key:key, name:mb.name.trim(), total:0, items:[]};
        map[key].total += +mb.share || 0;
        map[key].items.push({sid:sub.id, due:due, mid:mb.id});
      });
    });
  });
  return Object.keys(map).map(function(k){ return map[k]; }).sort(function(a,b){ return b.total - a.total; });
}
function subUnpaid(sub){
  var n = 0, t = today();
  (sub.members || []).forEach(function(mb){ memberDues(sub, mb, t).forEach(function(d){ if (!memberTx(sub.id, d, mb.id)) n++; }); });
  return n;
}
function relDay(d){
  var t = today(); if (d === t) return 'dnes';
  var z = new Date(); z.setDate(z.getDate()+1); if (d === fmtD(z)) return 'zítra';
  var x = parseD(d); return x.getDate() + '. ' + (x.getMonth()+1) + '.' + (x.getFullYear() !== new Date().getFullYear() ? ' ' + x.getFullYear() : '');
}
function subAcc(sub){ return acc(sub.acc) ? sub.acc : defaultAcc(); }
function processAuto(){
  var n = 0, t = today();
  (S.subs || []).forEach(function(sub){
    if (!sub.auto || sub.end) return;
    sub.handled = sub.handled || [];
    dues(sub, t).forEach(function(due){
      if (sub.handled.indexOf(due) >= 0) return;
      sub.handled.push(due);
      if (myTx(sub.id, due)) return;
      S.tx.push({id:uid(), date:due, type:'expense', amount:+sub.amount, acc:subAcc(sub), cat:sub.cat, note:sub.name, sub:sub.id, due:due});
      n++;
    });
  });
  return n;
}
function myPay(sid, due, quiet){
  var x = subById(sid); if (!x) return;
  var t = today();
  S.tx.push({id:uid(), date:due <= t ? due : t, type:'expense', amount:+x.amount, acc:subAcc(x), cat:x.cat, note:x.name, sub:sid, due:due});
  x.handled = x.handled || []; if (x.handled.indexOf(due) < 0) x.handled.push(due);
  save(); render(); if (!quiet) subDetail(sid); toast('Platba zapsána');
}

function addMemberTx(x, due, mb){
  S.tx.push({id:uid(), date:today(), type:'refund', amount:+mb.share, acc:subAcc(x), cat:x.cat, note:mb.name + ' – podíl ' + x.name, sub:x.id, due:due, member:mb.id});
}

function memberPay(sid, due, mid, quiet){
  var x = subById(sid); if (!x) return;
  var mb = (x.members || []).filter(function(m){ return m.id === mid; })[0]; if (!mb) return;
  var paid = memberTx(sid, due, mid);
  if (paid) {
    if (!confirm('Zrušit platbu od ' + mb.name + ' (' + dShort(due) + ')? Smaže se i zapsaná vratka.')) return;
    S.tx = S.tx.filter(function(t){ return t.id !== paid.id; });
    toast('Platba zrušena');
  } else {
    addMemberTx(x, due, mb);

function saveTx(e){

  if (d.type === 'transfer' && (!d.to || d.to === d.acc)) { toast('Převod musí jít mezi dvěma různými účty.'); return; }
  var t = {id:d.id || uid(), date:d.date, type:d.type, amount:Math.round(amt*100)/100, acc:d.acc, note:(d.note || '').trim()};
  if (d.type === 'transfer') t.to = d.to;

  if (d.sub) { t.sub = d.sub; t.due = d.due; if (d.member) t.member = d.member; }
  var idx = -1;
  S.tx.forEach(function(x,i){ if (x.id === t.id) idx = i; });

function download(name, text, mime){
  var blob = new Blob([text], {type:mime});
  try {
    if (isIOS() && navigator.canShare && typeof File === 'function') {
      var file = new File([blob], name, {type:mime});
      if (navigator.canShare({files:[file]})) { return navigator.share({files:[file], title:name}).then(function(){ return true; }, function(){ return false; }); }
    }
  } catch(e) {}
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 2000);
  return Promise.resolve(true);
}

window.App = {tab:tab, addTx:addTx, editTx:editTx, setTxType:setTxType, pickCat:pickCat, saveTx:saveTx, delTx:delTx,
  txSet:txSet, txNote:txNote, txSign:txSign, key:key, toggleSearch:toggleSearch,
  accForm:accForm, accTypeChange:accTypeChange, saveAcc:saveAcc, delAcc:delAcc, accDetail:accDetail, updateValue:updateValue, saveValue:saveValue,
  closeSheet:closeSheet, reveal:reveal, setHide:setHide, month:month, search:search, setFilter:setFilter, setRange:setRange, statGo:statGo,
  exportJSON:exportJSON, importClick:importClick, importFile:importFile, exportCSV:exportCSV, setCurrency:setCurrency,
  addCat:addCat, delCat:delCat, loadSample:loadSample, wipe:wipe,
  subForm:subForm, subDetail:subDetail, myPay:myPay, memberPay:memberPay, owedSheet:owedSheet, owedPay:owedPay, owedPayAll:owedPayAll, owedAll:owedAll,
  subCalc:subCalc, subAddMember:subAddMember, subDelMember:subDelMember, subSplit:subSplit, saveSub:saveSub, delSub:delSub, subIc:subIc};

testStorage();
S = load();
ui.txMonth = curYM(); ui.statMonth = curYM();
banner();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){}); } catch(e) {}
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') { closeSheet(); return; }
  if (!ui.txOpen || $('#sheetWrap').hidden) return;
  var tg = e.target && e.target.tagName;
  if (tg === 'INPUT' || tg === 'SELECT' || tg === 'TEXTAREA') return;
  if (/^[0-9]$/.test(e.key)) { key(e.key); e.preventDefault(); }
  else if (e.key === ',' || e.key === '.') { key(','); e.preventDefault(); }
  else if (e.key === 'Backspace') { key('del'); e.preventDefault(); }
  else if (e.key === 'Enter') { saveTx(); e.preventDefault(); }
});
document.addEventListener('visibilitychange', function(){
  if (document.hidden) {
    if (!ui.reveal) return;
    ui.reveal = false;
    if (document.querySelector('#sheet [data-wealth]')) closeSheet();
    if (ui.view === 'assets') render();
    return;
  }
  var n = processAuto();
  if (n) { save(); render(); toast(zap(n,'pravidelná platba','pravidelné platby','pravidelných plateb')); }
});
try {
  var mq = matchMedia('(prefers-color-scheme: dark)');
  var onTheme = function(){ render(); };
  if (mq.addEventListener) mq.addEventListener('change', onTheme); else if (mq.addListener) mq.addListener(onTheme);
} catch(e) {}
var autoN = processAuto();
if (autoN) save();
render();
if (autoN) toast(zap(autoN,'pravidelná platba','pravidelné platby','pravidelných plateb'));
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

})();
